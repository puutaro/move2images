name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - master  # masterにプッシュされたら実行

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # v3以降、デプロイにこの権限が必要な場合があります
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive  # テーマをサブモジュールで管理している場合
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true # Hugo Extended版を使う場合

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4  # 最新版に更新
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages  # 公開用ブランチを指定


